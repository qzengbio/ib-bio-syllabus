<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 240 128" role="img" aria-labelledby="title desc">
  <title id="title">Polarity of a water molecule</title>
  <desc id="desc">A water molecule with a partial negative charge on oxygen and partial positive charges on both hydrogen atoms.</desc>

  <rect width="240" height="160" fill="#ffffff"/>

  <g fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round">
    <path d="M104 67 L79 92"/>
    <path d="M136 67 L161 92"/>
  </g>

  <g fill="#111827" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="120" y="61" font-size="31">O</text>
    <text x="58" y="132" font-size="31">H</text>
    <text x="178" y="132" font-size="31">H</text>

    <text x="146" y="42" font-size="19">
      <tspan font-style="italic">δ</tspan><tspan dx="1">−</tspan>
    </text>
    <text x="84" y="113" font-size="19">
      <tspan font-style="italic">δ</tspan><tspan dx="1">+</tspan>
    </text>
    <text x="204" y="113" font-size="19">
      <tspan font-style="italic">δ</tspan><tspan dx="1">+</tspan>
    </text>
  </g>
</svg>
