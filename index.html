<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IB Biology 2025 Syllabus Outline</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="IB Syllabus" />
    <meta name="theme-color" content="#245f73" />
    <link rel="stylesheet" href="./syllabus-browser.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-panel">
        <div class="brand-line">
          <a class="brand" href="./" aria-label="IB Biology syllabus outline home">
            <img src="./favicon.svg" width="40" height="40" alt="" aria-hidden="true" />
            <strong>IB Biology Syllabus Outline</strong>
          </a>
          <div class="reader-controls" aria-label="Reading controls">
            <span>Font</span>
            <button id="fontSizeMinus" type="button" aria-label="Decrease font size">−</button>
            <strong id="fontSizeValue">17px</strong>
            <button id="fontSizePlus" type="button" aria-label="Increase font size">+</button>
          </div>
        </div>

        <div class="search-row">
          <label class="search-box">
            <span>Search the syllabus</span>
            <input id="searchInput" type="search" placeholder="Search understanding, guidance, code, topic..." />
          </label>
          <div class="filter-panel" aria-label="Syllabus filters">
            <div id="levelScopeButtons" class="scope-buttons level-scope-buttons" aria-label="Group scopes"></div>
          </div>
        </div>

      </header>

      <main class="workspace">
        <aside class="outline-panel" aria-label="Syllabus outline">
          <div class="panel-heading">
            <div>
              <p>Outline</p>
              <h1>Theme / Level / Topic</h1>
            </div>
            <div class="outline-actions">
              <button id="toggleOutline" class="mobile-outline-toggle" type="button" aria-expanded="false">Show</button>
              <button id="expandAll" type="button">Expand</button>
              <button id="collapseAll" type="button">Collapse</button>
            </div>
          </div>
          <div id="outlineTree" class="outline-tree"></div>
        </aside>

        <section class="reader-panel" aria-label="Selected syllabus content">
          <div class="reader-heading">
            <div>
              <h2 id="readerTitle">Syllabus understandings</h2>
            </div>
            <div class="reader-stats">
              <strong id="readerCount">0</strong>
            </div>
          </div>

          <div id="readerContent" class="reader-content"></div>
        </section>
      </main>
      <footer class="site-footer">
        <span>retaer@gmail.com</span>
        <span>Based on IB Biology guide, first assessment 2025</span>
        <span>Updated June 2026</span>
      </footer>
    </div>

    <script src="./syllabus-data.js"></script>
    <script src="./syllabus-browser.js"></script>
  </body>
</html>
